name: collect

# 예약 실행 + 수동 실행 + 이어달리기. 공개 저장소라 사용 시간 무제한.
# GitHub 예약(cron)은 자주 건너뛰어서, 실행이 끝나면 tick 워크플로가 시작 30분 뒤에 다음 실행을 시작함.
# Promo는 사진이 빈 장이 생기면 이 워크플로를 바로 실행함(사용자 결정 A안, 최소 5분 간격).
# cron은 끊겼을 때 다시 잇는 예비용. 이미 대기·실행 중인 다른 실행이 있으면 이어달리기를 안 걸어 두 줄로 갈라지지 않음.
on:
  schedule:
    - cron: "17,47 * * * *"  # 30분마다(예비). 출처별 회차 몫은 config.yaml(하루 한도 ÷ 48)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "받지 않고 계획만 출력"
        type: boolean
        default: false
      max_keep:
        description: "시험용: 통과 N장에서 멈춤(0=제한 없음)"
        type: number
        default: 0

concurrency:
  group: collect
  cancel-in-progress: false   # 겹치지 않게, 돌던 건 끝내기

permissions:
  contents: write             # state/report를 저장소에 commit(한도 집계 이어가기)
  actions: write              # 다음 실행 시작(이어달리기)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 35     # 수집은 22분에서 멈춤(30분 간격 맞추기 대기는 tick 워크플로가 함)
    steps:
      - name: start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: models-clip-v1

      - name: collect
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m collector.run --dry-run
          else
            python -m collector.run --max-keep "${{ inputs.max_keep || 0 }}"
          fi

      # 하루 한도 집계(state)와 리포트만 저장소에 남김. 사진은 commit하지 않음.
      - name: save state
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add state/ || true
          git commit -q -m "state: $(date -u +%F_%H:%M)" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break || sleep 5; done

      # 이어달리기: 다음 실행 예약은 별도 워크플로(tick)가 30분을 기다려 시작함.
      # 이 실행 안에서 기다리면 Promo가 바로 깨운 실행이 그동안 줄만 서 있게 되므로 여기서는 기다리지 않음.
      - name: chain next run
        if: ${{ !cancelled() && inputs.dry_run != true && (inputs.max_keep || 0) == 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/tick.yml/dispatches" -f ref=main -f "inputs[started]=$STARTED"
          echo "다음 실행 예약(tick) 걸어 둠"
