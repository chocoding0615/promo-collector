name: collect

# 예약 실행 + 수동 실행 + 이어달리기. 공개 저장소라 사용 시간 무제한.
# GitHub 예약(cron)은 자주 건너뛰어서, 실행이 끝나면 시작 30분 뒤에 다음 실행을 스스로 시작함.
# cron은 끊겼을 때 다시 잇는 예비용. 이미 대기·실행 중인 다른 실행이 있으면 이어달리기를 안 걸어 두 줄로 갈라지지 않음.
on:
  schedule:
    - cron: "17,47 * * * *"  # 30분마다(예비). 출처별 회차 몫은 config.yaml(하루 한도 ÷ 48)
  workflow_dispatch:
    inputs:
      dry_run:
        description: "받지 않고 계획만 출력"
        type: boolean
        default: false
      max_keep:
        description: "시험용: 통과 N장에서 멈춤(0=제한 없음)"
        type: number
        default: 0

concurrency:
  group: collect
  cancel-in-progress: false   # 겹치지 않게, 돌던 건 끝내기

permissions:
  contents: write             # state/report를 저장소에 commit(한도 집계 이어가기)
  actions: write              # 다음 실행 시작(이어달리기)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 50     # 수집은 22분에서 멈추고, 남는 시간은 30분 간격 맞추기 대기
    steps:
      - name: start time
        run: echo "STARTED=$(date +%s)" >> "$GITHUB_ENV"

      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: models-clip-v1

      - name: collect
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m collector.run --dry-run
          else
            python -m collector.run --max-keep "${{ inputs.max_keep || 0 }}"
          fi

      # 하루 한도 집계(state)와 리포트만 저장소에 남김. 사진은 commit하지 않음.
      - name: save state
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add state/ || true
          git commit -q -m "state: $(date -u +%F_%H:%M)" || { echo "변경 없음"; exit 0; }
          for i in 1 2 3; do git pull -q --rebase origin main && git push -q && break || sleep 5; done

      # 이어달리기: 시작 후 30분이 되면 다음 실행 시작. 시험 실행(dry_run·max_keep)은 잇지 않음.
      - name: chain next run
        if: ${{ !cancelled() && inputs.dry_run != true && (inputs.max_keep || 0) == 0 }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          wait=$(( STARTED + 1800 - $(date +%s) ))
          [ "$wait" -gt 0 ] && { echo "다음 실행까지 ${wait}초 대기"; sleep "$wait"; }
          others=$(gh api "repos/${{ github.repository }}/actions/workflows/collect.yml/runs?per_page=20" \
            --jq "[.workflow_runs[] | select(.id != ${{ github.run_id }}) | select(.status != \"completed\")] | length")
          if [ "$others" -gt 0 ]; then echo "이미 대기·실행 중인 실행 ${others}개 → 이어달리기 생략"; exit 0; fi
          gh api -X POST "repos/${{ github.repository }}/actions/workflows/collect.yml/dispatches" -f ref=main
          echo "다음 실행 시작함"
