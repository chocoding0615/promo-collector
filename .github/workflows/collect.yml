name: collect

# 예약 실행 + 수동 실행. 공개 저장소라 사용 시간 무제한.
# cron은 UTC이고 5~30분 늦을 수 있음(수집엔 무관).
on:
  schedule:
    - cron: "17 */3 * * *"   # 3시간마다. 한도는 config.yaml에서 관리
  workflow_dispatch:
    inputs:
      dry_run:
        description: "받지 않고 계획만 출력"
        type: boolean
        default: false

concurrency:
  group: collect
  cancel-in-progress: false   # 겹치지 않게, 돌던 건 끝내기

permissions:
  contents: write             # state/report를 저장소에 commit(한도 집계 이어가기)

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: install
        run: pip install -r requirements.txt

      - name: cache models
        uses: actions/cache@v4
        with:
          path: ~/.cache
          key: models-clip-v1

      - name: collect
        env:
          PIXABAY_KEY: ${{ secrets.PIXABAY_KEY }}
          GOOGLE_OAUTH: ${{ secrets.GOOGLE_OAUTH }}
          DRIVE_FOLDER_ID: ${{ secrets.DRIVE_FOLDER_ID }}
          SHEET_ID: ${{ secrets.SHEET_ID }}
        run: |
          if [ "${{ inputs.dry_run }}" = "true" ]; then
            python -m collector.run --dry-run
          else
            python -m collector.run
          fi

      # 하루 한도 집계(state)와 리포트만 저장소에 남김. 사진은 commit하지 않음.
      - name: save state
        if: ${{ !cancelled() && inputs.dry_run != true }}
        run: |
          git config user.name "collector-bot"
          git config user.email "collector-bot@users.noreply.github.com"
          git add state/ || true
          git commit -m "state: $(date -u +%F_%H:%M)" || echo "변경 없음"
          git push || echo "push 생략"
