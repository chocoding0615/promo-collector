# promo-collector 설정 — 출처별 시간 분배 수집
# 매시간 실행(runs_per_day: 24). 출처마다 "하루 한도 ÷ 24"를 이번 시간 몫으로 받습니다.
# 숫자는 첫날 실측(탈락률·오류)을 보고 조정합니다.

runs_per_day: 24
max_run_minutes: 40        # 한 번 실행 최대 시간(다음 시간 실행과 겹치지 않게)

sources:
  wikimedia:               # 대량 허용. 썸네일(2000px)로 받아 부담 감소
    enabled: true
    daily_limit: 6000      # → 시간당 약 250장
    per_query: 50
    min_interval_sec: 2
  pixabay:                 # 대량 다운로드 금지 → 소량. 검색은 24시간 캐시
    enabled: true
    needs_key: PIXABAY_KEY
    daily_limit: 500       # → 시간당 약 21장
    per_query: 30
    min_interval_sec: 1
  openverse:               # 키 없이 검색당 240건, 스크래핑 금지 → 소량
    enabled: true
    daily_limit: 300       # → 시간당 약 13장
    per_query: 20
    min_interval_sec: 2

checks:
  dedup_max_distance: 5
  allow_faces: false       # 클로즈업 얼굴만 탈락(멀거나 작은 사람은 통과)
  require_photo: true      # 그림·삽화·AI풍 탈락
  min_subject_score: 0.22
  min_long_side: 1000

# 카테고리 이름은 관리표의 기존 카테고리(한글)와 같게. 주제는 "한글|영어검색어"
# source_order: 앞 출처부터 이번 시간 몫이 남아 있으면 사용. need: 주제당 목표 통과 장수
